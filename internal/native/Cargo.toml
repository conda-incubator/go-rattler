[package]
name = "go-rattler-native"
version = "0.0.1"
edition = "2024"
license = "BSD-3-Clause"
publish = false

[lib]
name = "go_rattler_native"
crate-type = ["staticlib"]

[dependencies]
base64 = { version = "=0.23.1" }
rattler_conda_types = { version = "=0.57.0", default-features = false }
rattler_lock = { version = "=0.34.7", default-features = false }
pep440_rs = "=0.7.3"
pep508_rs = "=0.9.2"
rattler_redaction = { version = "=0.2.7", default-features = false }
url = "=2.5.8"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151" }

[dev-dependencies]
tempfile = "=3.27.0"
